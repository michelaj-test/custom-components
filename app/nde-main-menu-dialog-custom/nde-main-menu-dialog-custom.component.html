<div class="unimi-links-menu">
  <button class="unimi-links-toggle" (click)="toggleMenu()">
    <span class="unimi-links-label">
      Link utili UniMi
      <mat-icon  role="img" class="mat-icon notranslate nde-mat-icon-size mat-icon-no-color ng-star-inserted" aria-hidden="true" data-mat-icon-type="svg" data-mat-icon-name="Open-in-a-new-window">
        <svg height="80%" viewBox="0 -960 960 960" width="80%" fit="" preserveAspectRatio="xMidYMid meet" focusable="false"><path d="m256-240-56-56 384-384H240v-80h480v480h-80v-344L256-240Z"></path></svg></mat-icon>
    </span>

    <svg *ngIf="!isOpen" class="chevron" viewBox="0 0 24 24" width="18" height="18" focusable="false">
      <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
        
    <svg *ngIf="isOpen" class="chevron" viewBox="0 0 24 24" width="18" height="18" focusable="false">
      <path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="unimi-links-dropdown" *ngIf="isOpen">
    <ul class="unimi-links-list">
     <li>
      <a href="https://sba.unimi.it/it/chi-siamo/notizie-ed-eventi?title=&field_c_n_area_disciplinare_target_id=All&field_c_n_categoria_news_target_id=42"

    <li>
